<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Recruitment Hub</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .login-card {
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center px-4">

    <div class="w-full max-w-md">

        <!-- Brand -->
        <div class="text-center mb-8">
            <a href="{% url 'home' %}"
               class="text-3xl font-bold text-blue-700">
                Recruitment<span class="text-slate-800">Hub</span>
            </a>

            <p class="text-slate-500 mt-2">
                Administration Portal
            </p>
        </div>

        <!-- Login Card -->
        <div class="login-card bg-white rounded-2xl shadow-xl p-8">

            <div class="text-center mb-7">
                <div class="w-16 h-16 mx-auto mb-4 rounded-full
                            bg-blue-100 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg"
                         class="w-8 h-8 text-blue-700"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor"
                         stroke-width="1.8">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M12 15v2m-6 4h12a2 2 0 002-2v-5a2 2 0 00-2-2H6a2 2 0 00-2 2v5a2 2 0 002 2zm10-9V7a4 4 0 00-8 0v5h8z"/>
                    </svg>
                </div>

                <h1 class="text-2xl font-bold text-slate-800">
                    Admin Login
                </h1>

                <p class="text-slate-500 text-sm mt-2">
                    Sign in to manage Recruitment Hub
                </p>
            </div>

            <!-- Error Message -->
            {% if error %}
                <div class="bg-red-50 border border-red-200
                            text-red-700 rounded-lg p-3 mb-5 text-sm">
                    {{ error }}
                </div>
            {% endif %}

            <!-- Login Form -->
            <form method="POST">
                {% csrf_token %}

                <div class="mb-5">
                    <label for="username"
                           class="block text-sm font-semibold
                                  text-slate-700 mb-2">
                        Admin Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your admin username"
                        autocomplete="username"
                        required
                        class="w-full px-4 py-3 border border-slate-300
                               rounded-lg outline-none
                               focus:ring-2 focus:ring-blue-500
                               focus:border-blue-500 transition">
                </div>

                <div class="mb-6">
                    <label for="password"
                           class="block text-sm font-semibold
                                  text-slate-700 mb-2">
                        Password
                    </label>

                    <div class="relative">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                            class="w-full px-4 py-3 pr-16 border
                                   border-slate-300 rounded-lg
                                   outline-none focus:ring-2
                                   focus:ring-blue-500
                                   focus:border-blue-500 transition">

                        <button
                            type="button"
                            onclick="togglePassword()"
                            id="toggleButton"
                            class="absolute right-3 top-1/2
                                   -translate-y-1/2 text-sm
                                   font-semibold text-blue-700">
                            Show
                        </button>
                    </div>
                </div>

                <button
                    type="submit"
                    class="w-full bg-blue-700 hover:bg-blue-800
                           text-white font-semibold py-3 rounded-lg
                           transition duration-200 shadow-md">
                    Sign In as Admin
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="{% url 'home' %}"
                   class="text-sm text-slate-600
                          hover:text-blue-700 transition">
                    &larr; Back to Homepage
                </a>
            </div>

        </div>

        <p class="text-center text-xs text-slate-500 mt-6">
            Restricted access · Authorized administrators only
        </p>

    </div>

    <script>
        function togglePassword() {
            const password = document.getElementById("password");
            const button = document.getElementById("toggleButton");

            if (password.type === "password") {
                password.type = "text";
                button.textContent = "Hide";
            } else {
                password.type = "password";
                button.textContent = "Show";
            }
        }
    </script>

</body>
</html>
