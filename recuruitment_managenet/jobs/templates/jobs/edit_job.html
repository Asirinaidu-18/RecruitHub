<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Job | CareerHub</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100 text-slate-800">

    <nav class="bg-indigo-700 px-6 py-4 text-white shadow">
        <div class="mx-auto flex max-w-4xl items-center justify-between">
            <h1 class="text-xl font-bold">CareerHub Admin</h1>

            <a href="{% url 'manage_jobs' %}"
               class="text-sm font-medium hover:text-indigo-200">
                Back to Manage Jobs
            </a>
        </div>
    </nav>

    <main class="mx-auto max-w-3xl px-4 py-10">

        <div class="mb-6">
            <h2 class="text-3xl font-bold">Edit Job</h2>
            <p class="mt-2 text-slate-500">
                Update the job details below.
            </p>
        </div>

        <div class="rounded-2xl bg-white p-6 shadow-sm sm:p-8">

            <form method="POST" class="space-y-5">
                {% csrf_token %}

                <div>
                    <label for="title"
                           class="mb-2 block text-sm font-semibold">
                        Job Title
                    </label>
                    <input type="text"
                           id="title"
                           name="title"
                           value="{{ job.title }}"
                           required
                           class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label for="company"
                           class="mb-2 block text-sm font-semibold">
                        Company
                    </label>
                    <input type="text"
                           id="company"
                           name="company"
                           value="{{ job.company }}"
                           required
                           class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label for="location"
                           class="mb-2 block text-sm font-semibold">
                        Location
                    </label>
                    <input type="text"
                           id="location"
                           name="location"
                           value="{{ job.location }}"
                           required
                           class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label for="description"
                           class="mb-2 block text-sm font-semibold">
                        Job Description
                    </label>
                    <textarea id="description"
                              name="description"
                              rows="5"
                              required
                              class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500">{{ job.description }}</textarea>
                </div>

                <div>
                    <label for="salary"
                           class="mb-2 block text-sm font-semibold">
                        Salary
                    </label>
                    <input type="text"
                           id="salary"
                           name="salary"
                           value="{{ job.salary }}"
                           class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label for="skills"
                           class="mb-2 block text-sm font-semibold">
                        Required Skills
                    </label>
                    <textarea id="skills"
                              name="skills"
                              rows="3"
                              class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500">{{ job.skills }}</textarea>
                </div>

                <div class="flex flex-col gap-3 pt-3 sm:flex-row">

                    <button type="submit"
                            class="rounded-lg bg-indigo-600 px-6 py-3 font-semibold text-white transition hover:bg-indigo-700">
                        Update Job
                    </button>

                    <a href="{% url 'manage_jobs' %}"
                       class="rounded-lg border border-slate-300 px-6 py-3 text-center font-semibold hover:bg-slate-50">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </main>

</body>
</html>
