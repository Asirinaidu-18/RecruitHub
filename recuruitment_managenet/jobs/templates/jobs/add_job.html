<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Job | RecruitConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-800">

    <main class="mx-auto max-w-3xl px-5 py-12">

        <div class="mb-8">
            <a href="{% url 'manage_jobs' %}"
               class="text-sm font-semibold text-indigo-600 hover:text-indigo-800">
                ← Back to Manage Jobs
            </a>

            <h1 class="mt-5 text-3xl font-bold">Add New Job</h1>

            <p class="mt-2 text-slate-500">
                Enter the details below to publish a new job opportunity.
            </p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 rounded-lg bg-red-50 p-3 text-sm text-red-700">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% if error %}
            <div class="mb-4 rounded-lg bg-red-50 p-3 text-sm text-red-700">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" class="space-y-5 rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
            {% csrf_token %}

            <div>
                <label for="title" class="mb-2 block font-semibold">Job Title</label>
                <input id="title" name="title" type="text" required
                       placeholder="Python Developer Intern"
                       class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:border-indigo-500 focus:outline-none">
            </div>

            <div>
                <label for="company" class="mb-2 block font-semibold">Company</label>
                <input id="company" name="company" type="text" required
                       placeholder="Demo Technologies"
                       class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:border-indigo-500 focus:outline-none">
            </div>

            <div>
                <label for="location" class="mb-2 block font-semibold">Location</label>
                <input id="location" name="location" type="text" required
                       placeholder="Hyderabad"
                       class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:border-indigo-500 focus:outline-none">
            </div>

            <div>
                <label for="description" class="mb-2 block font-semibold">Job Description</label>
                <textarea id="description" name="description" rows="5" required
                          placeholder="Describe the responsibilities and requirements."
                          class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:border-indigo-500 focus:outline-none"></textarea>
            </div>

            <div>
                <label for="salary" class="mb-2 block font-semibold">Salary / Stipend</label>
                <input id="salary" name="salary" type="text" required
                       placeholder="₹10,000 per month"
                       class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:border-indigo-500 focus:outline-none">
            </div>

            <div>
                <label for="skills" class="mb-2 block font-semibold">Required Skills</label>
                <textarea id="skills" name="skills" rows="3" required
                          placeholder="Python, Django, MySQL"
                          class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:border-indigo-500 focus:outline-none"></textarea>
            </div>

            <div class="flex flex-col gap-3 pt-3 sm:flex-row">
                <button type="submit"
                        class="rounded-lg bg-indigo-600 px-6 py-3 font-semibold text-white hover:bg-indigo-700">
                    Save Job
                </button>

                <a href="{% url 'manage_jobs' %}"
                   class="rounded-lg border border-slate-300 px-6 py-3 text-center font-semibold hover:bg-slate-50">
                    Cancel
                </a>
            </div>

        </form>

    </main>

</body>
</html>
